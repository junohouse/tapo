[driver]
id = "tapo.dimmer"
name = "Tapo Dimmer Switch"
manufacturer = "TP-Link"
version = "1.0.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
# Behind the account, exactly as a Hue bulb is behind its bridge, and for the same reason: the
# credentials every dimmer needs are one account's and belong in one place. `Email` and
# `Password` are therefore *not* properties here — they are inherited, and a driver reads them
# through `Instance::property` without knowing or caring where they came from.
parent = "tapo.account"

# One load, dimmed. `supports_ramp` is deliberately absent: the switch has a fade time, but it
# is a setting stored on the device rather than something a single command can carry, so a
# `ramp_ms` accepted here would be quietly ignored — which is the failure that flag exists to
# prevent. Leaving it out is what keeps `ramp_start`/`ramp_stop` and the fade box off this
# dimmer's pane entirely, rather than drawing controls that can only warn.
#
# `has_button_events` likewise: the paddle works, and nothing local reports that it was
# pressed, so a rule triggered on a press would never fire.
#
# 1 rather than 0 for `min_on_level` because that is what the hardware takes — `brightness: 0`
# is refused, and off is `device_on: false`. See `set_level` in the driver.
[[proxy]]
id = 1
type = "light"
primary = true
name = "Dimmer"
capabilities = { dimmer = true, min_on_level = 1, max_on_level = 100 }

# A network device on port 80, and nothing more than that: KLAP goes out as `HostCall::Http`,
# which core owns end to end. This block used to declare `binary` and carry a `probe`, because
# neither the request nor the discovery could be expressed any other way — see the README.
[[control]]
id = 1
kind = "network"
name = "Tapo cloud"
port = 80

[[property]]
name = "Address"
type = "string"
required = true
tooltip = "IP address of the dimmer. The Tapo app shows it under the device's Settings → Device Info."

[[property]]
name = "Poll interval"
type = "ranged_int"
min = 5
max = 900
default = 30
unit = "s"
tooltip = "How often to ask the dimmer where it stands. Local, so this can be seconds."
