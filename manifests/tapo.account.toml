[driver]
id = "tapo.account"
name = "TP-Link Account"
manufacturer = "TP-Link"
# The maker's mark, linked and never copied — this package ships no TP-Link artwork. Core
# dereferences it once for the whole house (`GET /artwork?driver=<id>`) and every screen
# draws the same picture: the phone, the on-screen display and the wall panel.
icon = "https://static.tp-link.com/assets/images/icon/favicon-152px.png"
version = "1.0.0"
# The lead driver is a cloud login, which is neither what somebody bought nor what it does.
# The names in this package agree on nothing — `TP-Link Account` and `Tapo Dimmer Switch` — so
# unlike Hue there is no family name to fall back on, and it has to be said.
product = "TP-Link Tapo"
kind = "light"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
# Names the package. The dimmers are what somebody actually wanted, but this is what has to
# exist first, and a catalog should lead with the thing you install.
primary = true

# Not a hub. There is no box in a cupboard here — a TP-Link account is a login, and the devices
# behind it talk to the controller directly and never to it.
#
# `bridge` all the same, because the contract's *reason* fits exactly even where its examples do
# not: "a device in its own right so that the things every child needs — an address, a paired
# key — are held in one place. Change it once and every bulb behind it follows; without this
# each would carry its own copy and they would drift." Substitute the account for the address
# and that is precisely the problem this solves. Eight dimmers were eight copies of one
# password, and changing it meant editing eight devices and missing one.
[[proxy]]
id = 1
type = "bridge"
primary = true
name = "TP-Link Account"
capabilities = { child_driver = "tapo.dimmer" }

# The credentials, held once. Every dimmer inherits them — see `parent` in `tapo.dimmer`.
#
# Worth being plain about what these are, because they are not what most local integrations
# ask for: this is the TP-Link *cloud account*, and a Tapo checks local control against it
# because it stored a hash of it when the app first set it up. There is no per-device secret to
# issue instead, no pairing button, and nothing to revoke afterwards. The controller never
# sends them anywhere but to the devices on your own network.
[[property]]
name = "Email"
type = "string"
required = true
tooltip = "The TP-Link account your Tapo devices are paired to."

[[property]]
name = "Password"
type = "password"
required = true
tooltip = "That account's password. Checked against a device on your network, never against TP-Link."

# What answers this is a *dimmer*. The account answers nothing, because an account is not a
# thing with an address — so the rule that finds a dimmer lives here, on the driver that has to
# be installed and signed into before any dimmer can be added at all.
#
# `adopt_as` is what makes that two answers to one sighting rather than a lie. With no account
# in the project, finding a Tapo offers *this* driver: sign in first, there is nothing else to
# be done with it. Once an account exists, the same find offers the dimmer, adopted behind that
# account without anybody choosing a parent. Discovery finds the hub, and after that it finds
# the lights.
[discovery]
adopt_as = "tapo.dimmer"

# TP-Link's own discovery query, byte for byte from `python-kasa`'s `discover.py` — the same
# packet the Tapo app sends. The trailing four bytes are a checksum over the rest, and the
# whole thing is a published constant rather than something to derive: a packet assembled from
# a plausible-looking description is dropped by the device without a word, which is exactly
# what happened to the first version of this line.
[[discovery.udp]]
port = 20002
send_hex = "020000010000000000000000463cb5d3"
expect = "mgt_encrypt_schm"
